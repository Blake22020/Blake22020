name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: f852b8a36dc83923d374b2bcba03652338000049
          path: .expressive-profile

      - name: Render profile
        run: node .expressive-profile/action/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Remove generator credit and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          marker = '<a href="https://metawka.github.io/expressive-profile/'
          start = text.find(marker)
          if start >= 0:
              if text.find(marker, start + len(marker)) >= 0:
                  raise SystemExit("found multiple generator credit links")
              end = text.find("</a>", start)
              if end < 0:
                  raise SystemExit("generator credit link is incomplete")
              readme.write_text(text[:start] + text[end + 4:])

          for name in ("credit-light.svg", "credit-dark.svg"):
              (Path("assets") / name).unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md .profile
          git diff --cached --quiet || (git commit -m "Updated profile" && git push)
